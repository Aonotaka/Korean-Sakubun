<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理画面｜ひたすら韓国語作文</title>
    <meta name="description" content="ひたすら韓国語作文の管理画面です。管理者ログイン後に記事投稿と編集を行えます。" />
    <link rel="canonical" href="https://korean-sakubun.onrender.com/admin" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/KoreanSakubunLogo.png" />
    <meta property="og:title" content="管理画面｜ひたすら韓国語作文" />
    <meta property="og:description" content="管理者向けの投稿管理ページです。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://korean-sakubun.onrender.com/admin" />
    <meta property="og:image" content="https://korean-sakubun.onrender.com/KoreanSakubunLogo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="管理画面｜ひたすら韓国語作文" />
    <meta name="twitter:description" content="管理者向けの投稿管理ページです。" />
    <meta name="twitter:image" content="https://korean-sakubun.onrender.com/KoreanSakubunLogo.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <nav class="topbar" aria-label="サイトナビゲーション">
        <a class="brand" href="/">ひたすら韓国語作文</a>
        <div class="topbar__links">
          <a href="/">ホーム</a>
        </div>
      </nav>
      <div class="hero__content">
        <p class="eyebrow">Admin</p>
        <h1>管理画面</h1>
        <p class="hero__lead">ブログ記事の作成・編集・削除を行えます。管理者アカウントでログインしてください。</p>
      </div>
    </header>
    <main>
      <section class="section">
        <div class="panel" id="authPanel">
          <h2>ログイン</h2>
          <p class="panel__hint">管理者アカウントでログインしてください。</p>
          <form id="loginForm" class="auth-form">
            <label>メールアドレス<input type="email" id="loginEmail" required /></label>
            <label>パスワード<input type="password" id="loginPassword" required /></label>
            <button class="btn btn--primary" type="submit" id="loginSubmit">ログイン</button>
          </form>
          <p id="authMessage" class="session-status" aria-live="polite"></p>
        </div>
        <div class="panel" id="adminPanel" hidden>
          <div class="panel__head">
            <h2>記事管理</h2>
            <button class="btn btn--secondary" type="button" id="logoutBtn">ログアウト</button>
          </div>
          <form id="postForm" class="auth-form">
            <label>タイトル<input type="text" id="postTitle" required /></label>
            <label>要約<textarea id="postExcerpt" rows="2"></textarea></label>
            <label>本文<textarea id="postContent" rows="8" required></textarea></label>
            <button class="btn btn--primary" type="submit">投稿する</button>
          </form>
          <div id="postList" class="review-list"></div>

          <div class="panel" style="margin-top: 1.5rem;">
            <h2>ユーザー管理</h2>
            <p class="panel__hint">各アカウントのプランと保存数を確認し、プレミアム権限を付与できます。</p>
            <div id="userMessage" class="session-status" aria-live="polite"></div>
            <div id="userList" class="review-list"></div>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <p>ひたすら韓国語作文 — 管理画面</p>
    </footer>
    <script src="admin.js"></script>
  </body>
</html>
